<html lang="zh-CN">

    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #fdf6f0;
      color: #2d2d3f;
      overflow-x: hidden;
    }
    :root {
      --rose: #e8747c;
      --rose-light: #f5d6da;
      --rose-dark: #c75b63;
      --warm: #fdf0e8;
      --warm-dark: #f5e0d0;
      --purple: #7c6fa0;
      --purple-light: #e8e0f0;
      --gold: #e8c46a;
      --gold-light: #faf0d8;
      --dark: #2d2d3f;
      --gray: #8a8a9a;
      --gray-light: #c8c8d0;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      --radius: 16px;
    }

    .section-title {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 32px;
    }
    .section-title .sub {
      display: block;
      font-size: 14px;
      font-weight: 400;
      color: var(--gray);
      letter-spacing: 4px;
      margin-top: 6px;
    }

    /* Header */
    header {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(135deg, #fdf0e8 0%, #f8e0df 50%, #f0e4f0 100%);
      overflow: hidden;
      padding: 40px 20px;
    }
    header::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background:
        radial-gradient(circle at 30% 40%, rgba(232,116,124,0.06) 0%, transparent 50%),
        radial-gradient(circle at 70% 60%, rgba(124,111,160,0.06) 0%, transparent 50%);
      animation: floatBg 20s ease-in-out infinite;
    }
    @keyframes floatBg {
      0%, 100% { transform: translate(0,0) rotate(0deg); }
      33% { transform: translate(30px,-20px) rotate(1deg); }
      66% { transform: translate(-20px,30px) rotate(-1deg); }
    }
    header > * { position: relative; z-index: 1; }
    .hero-icon { font-size: 64px; margin-bottom: 20px; animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    header h1 {
      font-size: clamp(40px, 8vw, 72px);
      font-weight: 800;
      background: linear-gradient(135deg, var(--rose) 0%, var(--purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }
    header .tagline {
      font-size: clamp(16px, 3vw, 22px);
      color: var(--gray);
      letter-spacing: 6px;
      font-weight: 300;
      margin-bottom: 40px;
    }
    header .couple-names {
      display: flex; align-items: center; gap: 16px;
      font-size: 20px; color: var(--dark); font-weight: 500;
    }
    header .couple-names .heart-icon { color: var(--rose); font-size: 24px; }
    .scroll-hint {
      position: absolute; bottom: 30px; left: 50%;
      transform: translateX(-50%);
      animation: bounce 2s infinite;
      color: var(--gray); font-size: 14px; letter-spacing: 2px;
      cursor: pointer; z-index: 2; text-decoration: none;
    }
    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(10px); }
    }

    section { padding: 80px 20px; max-width: 1200px; margin: 0 auto; }

    /* Stats */
    #stats {
      background: linear-gradient(135deg, var(--rose) 0%, var(--purple) 100%);
      max-width: none; padding: 60px 20px; color: #fff;
    }
    #stats .section-title { color: #fff; }
    #stats .section-title .sub { color: rgba(255,255,255,0.7); }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 24px; max-width: 800px; margin: 0 auto;
    }
    .stat-item {
      text-align: center;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius: var(--radius);
      padding: 28px 16px;
      border: 1px solid rgba(255,255,255,0.2);
      transition: transform 0.3s;
    }
    .stat-item:hover { transform: translateY(-4px); }
    .stat-number { font-size: 42px; font-weight: 800; line-height: 1; margin-bottom: 6px; }
    .stat-label { font-size: 14px; opacity: 0.85; letter-spacing: 2px; }

    /* Map */
    #map-section { background: #fff; max-width: none; padding: 0; }
    #map-section .section-title { padding: 60px 20px 10px; margin-bottom: 10px; }
    #map-container { width: 100%; height: 600px; position: relative; }
    @media (max-width: 768px) { #map-container { height: 450px; } }

    /* 高德弹窗样式 */
    .amap-info-content {
      border-radius: 12px !important;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12) !important;
      font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif !important;
    }

    /* Timeline */
    #timeline { background: var(--warm); max-width: none; padding: 80px 20px; }
    .timeline-container {
      max-width: 700px; margin: 0 auto; position: relative; padding-left: 40px;
    }
    .timeline-container::before {
      content: '';
      position: absolute; left: 15px; top: 0; bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, var(--rose-light), var(--purple-light));
    }
    .timeline-item {
      position: relative; margin-bottom: 36px;
      animation: fadeInUp 0.6s ease backwards;
    }
    .timeline-item:nth-child(1) { animation-delay: 0.1s; }
    .timeline-item:nth-child(2) { animation-delay: 0.2s; }
    .timeline-item:nth-child(3) { animation-delay: 0.3s; }
    .timeline-item:nth-child(4) { animation-delay: 0.4s; }
    .timeline-item:nth-child(5) { animation-delay: 0.5s; }
    .timeline-item:nth-child(6) { animation-delay: 0.6s; }
    .timeline-item:nth-child(7) { animation-delay: 0.7s; }
    .timeline-item:nth-child(8) { animation-delay: 0.8s; }
    .timeline-item:nth-child(9) { animation-delay: 0.9s; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .timeline-dot {
      position: absolute; left: -32px; top: 4px;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--rose);
      border: 3px solid #fff; box-shadow: 0 0 0 2px var(--rose-light);
    }
    .timeline-card {
      background: #fff; border-radius: var(--radius);
      padding: 20px 24px; box-shadow: var(--shadow);
      cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
      border-left: 4px solid var(--rose);
    }
    .timeline-card:hover { transform: translateX(4px); box-shadow: 0 12px 40px rgba(0,0,0,0.1); }
    .timeline-card .month {
      font-size: 12px; color: var(--rose); font-weight: 600;
      letter-spacing: 2px; margin-bottom: 4px;
    }
    .timeline-card h3 { font-size: 18px; margin-bottom: 6px; }
    .timeline-card .brief { font-size: 14px; color: var(--gray); line-height: 1.6; }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
      z-index: 1000; align-items: center; justify-content: center;
      padding: 20px; animation: fadeIn 0.3s;

    .modal-overlay.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-content {
      background: #fff; border-radius: var(--radius);
      max-width: 520px; width: 100%; max-height: 80vh;
      overflow-y: auto; padding: 32px; position: relative;
      animation: slideUp 0.3s ease;

    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-close {

      width: 36px; height: 36px; border-radius: 50%; border: none;

      display: flex; align-items: center; justify-content: center;
      color: var(--gray); transition: all 0.2s;

    .loading::after {

      border: 3px solid var(--gray-light);
      border-top-color: var(--rose);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;

      font-size: 12px !important;
      font-weight: 600 !important;
      padding: 3px 12px !important;

    @media (max-width: 480px) {

      .timeline-container { padding-left: 32px; }
      .timeline-dot { left: -25px; width: 12px; height: 12px; }
      .modal-content { padding: 24px; }

  </style>
</head>

    function getMonthLabel(monthStr) {
      const [y, m] = monthStr.split('-');
      const ms = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
      return `${y}年 ${ms[parseInt(m)-1]}`;
    }
    function formatShort(m) {
      return m.replace('-', '.');
    }

    function animateNum(el, target, dur = 1000) {
      const start = parseInt(el.textContent) || 0;
      const t0 = performance.now();
      function tick(now) {
        const p = Math.min((now - t0) / dur, 1);
        const e = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(start + (target - start) * e);
        if (p < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    async function fetchMemories() {

        if (!supabase) throw new Error('SDK 未加载');

        throw new Error('数据为空');
      } catch (err) {
        console.warn('⚠️ 使用本地数据:', err.message);
        memories = FALLBACK_MEMORIES;
        return memories;
      }
    }

    function renderStats(data) {
      const pm = { '天津初识地':'天津市','北京科技大学天津学院':'天津市','天津财经大学珠江学院':'天津市','青岛':'山东省','秦皇岛':'河北省','康定情歌广场':'四川省','成都武侯区红运花园馨苑':'四川省','重庆见家长':'重庆市','西安':'陕西省' };
      const provinces = new Set(data.map(d => pm[d.location_name] || '其他'));
      const months = data.map(d => d.event_month).sort();
      if (months.length >= 2) {
        const [y1,m1] = months[0].split('-').map(Number);
        const [y2,m2] = months[months.length-1].split('-').map(Number);
        animateNum(document.getElementById('monthSpan'), (y2-y1)*12+(m2-m1)+1);
      } else if (months.length === 1) {
        document.getElementById('monthSpan').textContent = '1';
      }
      animateNum(document.getElementById('provinceCount'), provinces.size);
      animateNum(document.getElementById('cityCount'), data.length);
      animateNum(document.getElementById('tripCount'), data.length);
    }

    function initMap(data) {
      const container = document.getElementById('map-container');
      container.innerHTML = '';

      // 使用高德地图瓦片——国内访问最快，无需任何配置
      map = L.map('map-container', {
        center: [35.0, 104.0],
        zoom: 5,
        zoomControl: true,
        attributionControl: false,
      });

      // 高德地图路网图（国内CDN，速度快，显示中文地名）
      L.tileLayer('https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
        maxZoom: 18,
        minZoom: 3,
        subdomains: ['webrd01', 'webrd02', 'webrd03', 'webrd04'],
      }).addTo(map);

      const valid = data.filter(d => d.lat != null && d.lng != null);
      if (valid.length === 0) return;

      // 自定义爱心图标
      const heartIcon = L.divIcon({
        className: '',
        iconSize: [44, 44],
        iconAnchor: [22, 54],
        html: `<div style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#e8747c,#7c6fa0);border:3px solid #fff;box-shadow:0 4px 16px rgba(232,116,124,0.5),0 0 0 4px rgba(232,116,124,0.15);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;font-weight:bold;">❤</div>`,
      });

      valid.forEach((d, i) => {
        const short = formatShort(d.event_month);
        const marker = L.marker([d.lat, d.lng], { icon: heartIcon }).addTo(map);

        // 地点名称标签（永久显示）
        marker.bindTooltip(`${d.location_name} · ${short}`, {
          permanent: true,
          direction: 'top',
          offset: L.point(0, -30),
          className: 'custom-marker-label',
        });

        // 点击弹出详情
        marker.bindPopup(`
          <div style="font-family:sans-serif;padding:8px;max-width:250px;">
            <h3 style="color:#e8747c;font-size:18px;margin:0 0 4px;">${d.location_name}</h3>
            <div style="font-size:12px;color:#8a8a9a;margin-bottom:6px;">${getMonthLabel(d.event_month)}</div>
            <div style="font-size:14px;line-height:1.6;color:#555;">${d.description || '还没有记录描述~'}</div>
          </div>
        `);

        marker.on('click', () => openModal(d));
        markers.push(marker);
      });

      // 连线
      if (valid.length >= 2) {
        L.polyline(valid.map(d => [d.lat, d.lng]), {
          color: 'rgba(232,116,124,0.5)',
          weight: 3,
          dashArray: '10, 10',
        }).addTo(map);
      }

      // 适配视野
      if (markers.length > 0) {
        const group = L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.15));
      }
    }

    function renderTimeline(data) {
      const container = document.getElementById('timelineContainer');
      container.innerHTML = '';
      data.forEach(d => {
        const item = document.createElement('div');
        item.className = 'timeline-item';
        item.innerHTML = `
          <div class="timeline-dot"></div>
          <div class="timeline-card">
            <div class="month">${formatShort(d.event_month)}</div>
            <h3>${d.location_name}</h3>
            <div class="brief">${d.description ? d.description.substring(0,60)+(d.description.length>60?'...':'') : '点击查看详情'}</div>
          </div>`;
        item.querySelector('.timeline-card').addEventListener('click', () => openModal(d));
        container.appendChild(item);
      });
    }

    function openModal(d) {
      document.getElementById('modalMonth').textContent = getMonthLabel(d.event_month);
      document.getElementById('modalTitle').textContent = d.location_name;
      document.getElementById('modalDesc').textContent = d.description || '还没有记录描述~';
      const pc = document.getElementById('modalPhotos');
      pc.innerHTML = '';
      if (d.photos && d.photos.length > 0) {
        d.photos.forEach(url => {
          const img = document.createElement('img');
          img.src = url; img.alt = '回忆照片';
          img.style.cssText = 'width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;';
          pc.appendChild(img);
        });
      } else {
        for (let i = 0; i < 3; i++) { const p = document.createElement('div'); p.className = 'photo-placeholder'; p.textContent = '📷'; pc.appendChild(p); }
        const h = document.createElement('p');
        h.style.cssText = 'grid-column:1/-1;font-size:13px;color:var(--gray);text-align:center;margin-top:4px;';
        h.textContent = '照片还没上传，期待你的回忆 📸';
        pc.appendChild(h);
      }
      document.getElementById('modalCoords').textContent = (d.lat && d.lng) ? `📍 ${d.lat.toFixed(4)}, ${d.lng.toFixed(4)}` : '📍 坐标待补充';
      document.getElementById('modalOverlay').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    document.getElementById('modalClose').addEventListener('click', () => {
      document.getElementById('modalOverlay').classList.remove('active');
      document.body.style.overflow = '';
    });
    document.getElementById('modalOverlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) { document.getElementById('modalOverlay').classList.remove('active'); document.body.style.overflow = ''; }
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { document.getElementById('modalOverlay').classList.remove('active'); document.body.style.overflow = ''; }
    });

    async function main() {
      const data = await fetchMemories();
      renderStats(data);
      renderTimeline(data);
      setTimeout(() => initMap(data), 300);
    }
    window.addEventListener('load', main);
  </script>

</body>
</html>
